[package]
name = "portable-pty"
version = "0.9.0"
authors = ["Wez Furlong"]
edition = "2018"
repository = "https://github.com/wezterm/wezterm"
description = "Cross platform pty interface"
license = "MIT"
documentation = "https://docs.rs/portable-pty"
publish = false

# Vendored from crates.io portable-pty 0.9.0 so Windows ConPTY spawn can set
# STARTF_USESHOWWINDOW | SW_HIDE. CREATE_NO_WINDOW is intentionally not set:
# it stops the ConPTY conhost helper from starting. See psuedocon.rs.

[dependencies]
anyhow = "1.0"
downcast-rs = "1.0"
filedescriptor = "0.8.3"
log = "0.4"
shell-words = "1.1"
serde_derive = { version = "1.0", optional = true }
serde = { version = "1.0", optional = true }
serial2 = "0.2"

[features]
default = []
serde_support = ["serde", "serde_derive"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.28", features = ["term", "fs"] }

[target.'cfg(windows)'.dependencies]
bitflags = "1.3"
lazy_static = "1.4"
shared_library = "0.1"
winapi = { version = "0.3", features = [
    "winuser",
    "consoleapi",
    "handleapi",
    "fileapi",
    "namedpipeapi",
    "synchapi",
] }
winreg = "0.10"
