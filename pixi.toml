[workspace]
authors = ["Amirhossein Davoody <amirhossein.davoody@gmail.com>"]
channels = ["conda-forge"]
description = "Terminal-first ADE GUI (host) with remote Fresh backend"
name = "fresh-gui"
platforms = ["linux-64"]
preview = ["pixi-build"]
version = "2026.730.14"

# Packaged Linux binary (`fresh-gui` + share/fresh-gui/ui) — same role as
# `pixi run serve`. Install with:
#   pixi global install --git https://github.com/amirhosseindavoody/fresh-gui.git
[package]
name = "fresh-gui"
version = "2026.730.14"
description = "Linux remote daemon for fresh-gui (browser UI + PTY shells)"
authors = ["Amirhossein Davoody <amirhossein.davoody@gmail.com>"]
license = "GPL-2.0"
repository = "https://github.com/amirhosseindavoody/fresh-gui"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "0.*" }


[tasks]
check = "cargo check --workspace"
test = "cargo test --workspace"
build = "cargo build --workspace"
clippy = "cargo clippy --workspace --all-targets -- -D warnings"
fmt = "cargo fmt --all"
fmt-check = "cargo fmt --all -- --check"
backend = "cargo run -p fresh-gui --"
# Build UI then start a detached background session (prints URL, returns).
serve = { depends-on = ["ui-build"], cmd = "cargo run -p fresh-gui --" }
# Same as `serve`, but Cargo `--release`. Detaches like a normal `fresh-gui`
# start (prints URL and returns). Use `--foreground` when you want logs in the
# terminal: `pixi run backend -- --foreground`.
# (Packaged installs still use thin LTO + strip via `recipe/build.sh`.)
serve-release = { depends-on = ["ui-build"], cmd = "cargo run --release -p fresh-gui --" }
# Stop the current user's detached session.
close = "cargo run -p fresh-gui -- close"
status = "cargo run -p fresh-gui -- status"
build-release = "cargo build --release -p fresh-gui"
backend-release = "cargo run --release -p fresh-gui --"
app = "cargo run -p fresh-gui-app --"
ui = { cwd = "crates/fresh-gui-app/ui", cmd = "bun run dev" }
ui-install = { cwd = "crates/fresh-gui-app/ui", cmd = "bun install" }
ui-build = { depends-on = ["ui-install"], cwd = "crates/fresh-gui-app/ui", cmd = "bun run build" }
ui-serve = "cargo run -p fresh-gui-app -- serve-ui"
package = "pixi build -o dist"
update-version = "scripts/update-version.sh"

[dependencies]
rust = ">=1.97.1,<1.98"
bun = ">=1.2,<2"
