[workspace]
authors = ["Amirhossein Davoody <amirhossein.davoody@gmail.com>"]
channels = ["conda-forge"]
description = "Terminal-first ADE GUI (host) with remote Fresh backend"
name = "fresh-gui"
platforms = ["linux-64"]
preview = ["pixi-build"]
version = "2026.728.1"

# Packaged Linux binary (`fresh-gui-backend` + share/fresh-gui/ui) — same role as
# `pixi run serve`. Install with: `pixi global install --path .`
[package]
name = "fresh-gui-backend"
version = "2026.728.1"
description = "Linux remote daemon for fresh-gui (browser UI + PTY shells)"
authors = ["Amirhossein Davoody <amirhossein.davoody@gmail.com>"]
license = "GPL-2.0"
repository = "https://github.com/amirhosseindavoody/fresh-gui"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "0.*" }

[tasks]
check = "cargo check --workspace --exclude fresh-gui-desktop"
test = "cargo test --workspace --exclude fresh-gui-desktop"
build = "cargo build --workspace --exclude fresh-gui-desktop"
clippy = "cargo clippy --workspace --exclude fresh-gui-desktop --all-targets -- -D warnings"
fmt = "cargo fmt --all"
fmt-check = "cargo fmt --all -- --check"
backend = "cargo run -p fresh-gui-backend --"
# Build UI then run backend (serves ui/dist + /ws on one port).
serve = { depends-on = ["ui-build"], cmd = "cargo run -p fresh-gui-backend --" }
app = "cargo run -p fresh-gui-app --"
ui = { cwd = "crates/fresh-gui-app/ui", cmd = "bun run dev" }
ui-build = { cwd = "crates/fresh-gui-app/ui", cmd = "bun run build" }
ui-install = { cwd = "crates/fresh-gui-app/ui", cmd = "bun install" }
ui-serve = "cargo run -p fresh-gui-app -- serve-ui"
desktop = "cargo run -p fresh-gui-desktop --"
package = "pixi build -o dist"
update-version = "scripts/update-version.sh"

[dependencies]
rust = ">=1.97.1,<1.98"
bun = ">=1.2,<2"
