[workspace]
resolver = "2"
members = [
    "crates/fresh-gui-protocol",
    "crates/fresh-gui-backend",
    "crates/fresh-gui-client",
    "crates/fresh-gui-app",
    "crates/fresh-gui-desktop",
]
default-members = [
    "crates/fresh-gui-protocol",
    "crates/fresh-gui-backend",
    "crates/fresh-gui-client",
    "crates/fresh-gui-app",
]

[workspace.package]
version = "2026.728.1"
edition = "2024"
license = "GPL-2.0"
repository = "https://github.com/amirhosseindavoody/fresh-gui"
authors = ["Amirhossein Davoody <amirhossein.davoody@gmail.com>"]
rust-version = "1.97"

[workspace.dependencies]
fresh-gui-protocol = { path = "crates/fresh-gui-protocol" }
fresh-gui-client = { path = "crates/fresh-gui-client" }

anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
portable-pty = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.49", features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tower-http = { version = "0.6", features = ["fs"] }
tokio-tungstenite = { version = "0.26", features = ["connect"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["serde", "v4"] }
url = "2.5"
