[workspace]
resolver = "2"
members = [
    "crates/fresh-gui-protocol",
    "crates/fresh-gui-backend",
    "crates/fresh-gui-client",
    "crates/fresh-gui-app",
]

[workspace.package]
version = "2026.728.1"
edition = "2024"
license = "GPL-2.0"
repository = "https://github.com/amirhosseindavoody/fresh-gui"
authors = ["Amirhossein Davoody <amirhossein.davoody@gmail.com>"]
rust-version = "1.97"

[workspace.dependencies]
fresh-gui-protocol = { path = "crates/fresh-gui-protocol" }
fresh-gui-client = { path = "crates/fresh-gui-client" }

anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
