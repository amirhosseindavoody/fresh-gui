[package]
name = "fresh-gui-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Native GPUI ADE host for fresh-gui"
readme = "README.md"

[[bin]]
name = "fresh-gui-app"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-channel = "2.3"
clap = { workspace = true }
fresh-gui-client = { workspace = true }
fresh-gui-protocol = { workspace = true }
# Pin the same gpui-pre snapshot gpui-kit 0.6.6 / gpui-component require
# (`=0.3.6`) so Cargo does not resolve a second gpui crate instance.
gpui = { package = "gpui-pre", version = "=0.3.6" }
gpui-kit = { version = "0.6.6", features = [
    # Enable gpui-component's bundled tree-sitter grammars used by EditorPanel.
    "tree-sitter",
    "tree-sitter-rust",
    "tree-sitter-python",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-javascript",
    "tree-sitter-toml",
    "tree-sitter-markdown",
    "tree-sitter-yaml",
    "tree-sitter-bash",
    "tree-sitter-html",
    "tree-sitter-css",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-go",
] }
serde = { workspace = true }
serde_json = { workspace = true }
jsonc-parser = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Apache-2.0. Cell grid only — the PTY stays portable-pty on the daemon.
alacritty_terminal = "0.25.1"
# Same major as gpui-pre's image, so the X11 icon type is one crate.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
# GPUI 0.3.6 opens the Win32 clipboard with a null owner before clearing it,
# which prevents SetClipboardData from publishing text. Use the window handle.
clipboard-win = "5.4.1"
raw-window-handle = "0.6"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.6", features = ["test-support"] }

# x11/wayland features pull gpui-pre-linux, which is not a dependency on
# Windows. Keep them on Linux/FreeBSD only so the GPUI client can build there.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.6", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd")))'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.6", features = [
    "font-kit",
    "runtime_shaders",
] }
