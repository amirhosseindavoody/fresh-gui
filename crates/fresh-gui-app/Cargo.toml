[package]
name = "fresh-gui-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Native GPUI ADE host for fresh-gui (CLI + optional Vite UI)"
readme = "README.md"

[[bin]]
name = "fresh-gui-app"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-channel = "2.3"
axum = { workspace = true }
clap = { workspace = true }
fresh-gui-client = { workspace = true }
fresh-gui-protocol = { workspace = true }
# Pin the same gpui-pre snapshot gpui-kit 0.6.6 / gpui-component require
# (`=0.3.6`) so Cargo does not resolve a second gpui crate instance.
gpui = { package = "gpui-pre", version = "=0.3.6" }
gpui-kit = "0.6.6"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
vte = "0.14"

# x11/wayland features pull gpui-pre-linux, which is not a dependency on
# Windows. Keep them on Linux/FreeBSD only so the GPUI client can build there.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.6", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd")))'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.6", features = [
    "font-kit",
    "runtime_shaders",
] }
