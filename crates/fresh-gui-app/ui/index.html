<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fresh-gui</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1116;
        --panel: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #3fb950;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: radial-gradient(1200px 600px at 10% -10%, #1a2332 0%, var(--bg) 55%);
        color: var(--text);
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      }
      body {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100%;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: end;
        padding: 0.85rem 1rem;
        border-bottom: 1px solid var(--border);
        background: color-mix(in srgb, var(--panel) 88%, transparent);
        backdrop-filter: blur(8px);
      }
      .brand {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin-right: 0.5rem;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        font-size: 0.75rem;
        color: var(--muted);
      }
      input {
        min-width: 16rem;
        padding: 0.45rem 0.6rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #0d1117;
        color: var(--text);
        font: inherit;
      }
      button {
        padding: 0.5rem 0.9rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #21262d;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: color-mix(in srgb, var(--accent) 35%, #21262d);
        border-color: color-mix(in srgb, var(--accent) 50%, var(--border));
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      #status { font-size: 0.8rem; color: var(--muted); margin-left: auto; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #main {
        display: grid;
        grid-template-columns: minmax(200px, 280px) 1fr;
        min-height: 0;
        height: 100%;
      }
      #tree-panel {
        border-right: 1px solid var(--border);
        background: color-mix(in srgb, var(--panel) 70%, transparent);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      #tree-panel h2 {
        margin: 0;
        padding: 0.65rem 0.75rem;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
      }
      #tree {
        overflow: auto;
        padding: 0.4rem 0.35rem 0.75rem;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
        flex: 1;
      }
      .tree-item {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.2rem 0.35rem;
        border-radius: 4px;
        cursor: pointer;
        user-select: none;
      }
      .tree-item:hover { background: #21262d; }
      .tree-item.selected { background: color-mix(in srgb, var(--accent) 22%, #21262d); }
      .tree-item .twist { width: 1rem; color: var(--muted); flex-shrink: 0; }
      .tree-item .kind { color: var(--muted); }
      .tree-children { margin-left: 0.85rem; border-left: 1px solid var(--border); }
      #term-wrap {
        padding: 0.75rem;
        min-height: 0;
        min-width: 0;
      }
      #terminal {
        height: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        background: #010409;
      }
      @media (max-width: 720px) {
        #main { grid-template-columns: 1fr; grid-template-rows: 40% 1fr; }
        #tree-panel { border-right: none; border-bottom: 1px solid var(--border); }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">fresh-gui</div>
      <label>
        Backend WS
        <input id="url" value="ws://127.0.0.1:7420/ws" spellcheck="false" />
      </label>
      <label>
        Token
        <input id="token" type="password" placeholder="optional on loopback" spellcheck="false" />
      </label>
      <button id="connect" class="primary" type="button">Connect</button>
      <button id="disconnect" type="button" disabled>Disconnect</button>
      <div id="status">disconnected</div>
    </header>
    <div id="main">
      <aside id="tree-panel">
        <h2>Files</h2>
        <div id="tree"><div class="tree-empty" style="padding:0.75rem;color:var(--muted)">Connect to load remote tree</div></div>
      </aside>
      <div id="term-wrap">
        <div id="terminal"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
