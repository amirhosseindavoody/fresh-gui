<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fresh-gui</title>
  </head>
  <body>
    <header>
      <div class="brand">fresh-gui</div>
      <label>
        Backend WS
        <input id="url" value="ws://127.0.0.1:7420/ws" spellcheck="false" />
      </label>
      <label>
        Token
        <input id="token" type="password" placeholder="optional on loopback" spellcheck="false" />
      </label>
      <label>
        Session
        <input id="session" placeholder="empty = create new" spellcheck="false" />
      </label>
      <button id="connect" class="primary" type="button">Connect</button>
      <button id="disconnect" type="button" disabled>Disconnect</button>
      <div id="status">disconnected</div>
    </header>
    <div id="tabs-bar">
      <button id="new-tab" type="button" disabled>+ Tab</button>
      <button
        id="split-h"
        type="button"
        disabled
        title="Show two shells side by side (opens a second tab if needed)"
      >
        Split ‖
      </button>
      <button
        id="split-v"
        type="button"
        disabled
        title="Show two shells stacked (opens a second tab if needed)"
      >
        Split ═
      </button>
      <button id="split-off" type="button" disabled title="Show only the active tab">
        No split
      </button>
      <div id="tabs"></div>
    </div>
    <div id="main">
      <aside id="tree-panel">
        <h2>Files</h2>
        <div id="tree">
          <div class="tree-empty" style="padding: 0.75rem; color: var(--muted)">
            Connect to load remote tree
          </div>
        </div>
      </aside>
      <div id="work">
        <div id="editor-panel">
          <div id="editor-bar">
            <span class="path" id="editor-path">No file open</span>
            <button id="editor-save" type="button" disabled title="Save (Ctrl/Cmd+S)">Save</button>
            <button id="editor-close" type="button" title="Hide editor">Close</button>
          </div>
          <div id="editor-host"></div>
        </div>
        <div id="term-area">
          <div id="panes" class="no-split"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
