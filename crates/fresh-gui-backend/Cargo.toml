[package]
name = "fresh-gui-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Linux remote daemon for fresh-gui (PTY + Fresh editor ADE protocol)"
readme = "README.md"

[[bin]]
name = "fresh-gui-backend"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
fresh = { path = "../../vendor/fresh/crates/fresh-editor", package = "fresh-editor", default-features = false, features = ["runtime"] }
fresh-gui-protocol = { workspace = true }
futures-util = { workspace = true }
notify = { workspace = true }
portable-pty = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
fresh-gui-client = { workspace = true }
tokio = { workspace = true }
