[package]
name = "fresh-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Remote daemon for fresh-gui (PTY + Fresh editor ADE protocol)"
readme = "README.md"

[[bin]]
name = "fresh-gui"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
fresh = { path = "../../vendor/fresh/crates/fresh-editor", package = "fresh-editor", default-features = false, features = ["runtime"] }
fresh-gui-protocol = { workspace = true }
futures-util = { workspace = true }
notify = { workspace = true }
portable-pty = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jsonc-parser = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[dev-dependencies]
fresh-gui-client = { workspace = true }
tokio = { workspace = true }
