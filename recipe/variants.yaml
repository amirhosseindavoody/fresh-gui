# Default variants for pixi / rattler-build outside conda-forge pinning.
# Required so ${{ stdlib('c') }} / ${{ compiler(...) }} resolve for
# `pixi global install --git` (see prefix-dev/pixi#5272).
c_stdlib:
  - if: linux
    then: sysroot
  - if: osx
    then: macosx_deployment_target
  - if: win
    then: vs

c_stdlib_version:
  - if: linux
    then: "2.28"
  - if: osx
    then: "11.0"

c_compiler:
  - if: unix
    then: gcc
  - if: win
    then: vs2019

rust_compiler:
  - rust
