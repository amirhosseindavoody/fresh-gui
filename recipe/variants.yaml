# Optional / unused by recipe.yaml after switching to explicit linux-* build
# packages. Kept so older recipes or conda-forge ports can still reference it.
# Prefer listing sysroot_linux-64 / gcc_linux-64 / rust directly in recipe.yaml
# for `pixi global install --git` (avoids pixi#5272 stdlib Jinja failures).
c_stdlib:
  - sysroot
c_stdlib_version:
  - "2.28"
c_compiler:
  - gcc
rust_compiler:
  - rust
