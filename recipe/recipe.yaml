# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# Install (on linux-64 only; this package is the remote Linux daemon):
#   pixi global install --git https://github.com/amirhosseindavoody/fresh-gui.git
#
# Private GitHub repos need working git credentials (gh auth setup-git, or use
# git@github.com:amirhosseindavoody/fresh-gui.git). The build script fetches Fresh
# from vendor/fresh.rev when the submodule is not checked out.
context:
  version: 2026.729.12

package:
  name: fresh-gui
  version: ${{ version }}

source:
  path: ..
  use_gitignore: true

build:
  number: 0
  # linux-64 only for MVP (remote daemon; not the Windows host GUI).
  skip: not linux64
  script: build.sh

requirements:
  build:
    # Explicit packages (no ${{ stdlib/compiler }} Jinja) so `pixi global install
    # --git` works without conda-forge pinning / variants.yaml (pixi#5272).
    - sysroot_linux-64 >=2.28
    - gcc_linux-64
    - rust >=1.97.1,<1.98
    - cargo-auditable
    - cargo-bundle-licenses
    - bun
    - git
  run:
    - libgcc >=13

tests:
  - script:
      - fresh-gui --help
      - fresh-gui --version
      - test -f "${PREFIX}/share/fresh-gui/ui/index.html"
  - package_contents:
      bin:
        - fresh-gui
      files:
        exists:
          - share/fresh-gui/ui/index.html

about:
  homepage: https://github.com/amirhosseindavoody/fresh-gui
  repository: https://github.com/amirhosseindavoody/fresh-gui
  summary: Linux remote daemon for fresh-gui (browser UI + PTY shells over WebSocket)
  description: |
    Installable Linux binary equivalent to `pixi run serve` / `pixi run serve-release`:
    serves the host web UI and WebSocket ADE API so you can open shells from a
    browser (or any host that can reach the URL) before using the native GUI client.

    Platform: linux-64 only. Install on the remote Linux machine, not the Windows host GUI.
  license: GPL-2.0-only
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - amirhosseindavoody
