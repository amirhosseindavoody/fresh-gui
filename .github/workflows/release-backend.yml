# Bump CalVer, build the linux-64 fresh-gui pixi package + standalone
# binaries (linux-gnu glibc≥2.31, linux-musl, windows-msvc) and the GPUI
# hosts (linux-gnu, windows-msvc), and publish a GitHub Release.
#
# Triggers on every push to main (merge), on manual dispatch, and on pull
# requests that touch the client build. The release job does not run on pull
# requests: it bumps CalVer, pushes main, and creates the GitHub Release.
# The Linux GPUI client job still builds and packages on those PRs so the
# archive steps are verified before merge. Commits/tags pushed with
# GITHUB_TOKEN do not re-trigger this workflow.

name: Release backend

on:
  push:
    branches: [main]
  # Full release (version bump + GitHub Release) stays push/dispatch only.
  # These paths re-run the Linux GPUI client build + package on the PR.
  pull_request:
    paths:
      - ".github/workflows/release-backend.yml"
      - "scripts/package-client.sh"
      - "crates/fresh-gui-app/**"
      - "crates/fresh-gui-client/**"
      - "crates/fresh-gui-protocol/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      bump:
        description: Bump CalVer (YYYY.MMDD.N) before building
        type: boolean
        default: true
      version:
        description: Optional explicit version (YYYY.MMDD.N). Empty = auto bump.
        type: string
        required: false
        default: ""

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-backend-pr-{0}', github.ref) || 'release-backend-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Bump · package · release
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    # Avoid publishing releases from forks. Skip bot release commits if they
    # ever re-trigger (e.g. PAT instead of GITHUB_TOKEN).
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'amirhosseindavoody/fresh-gui' &&
      (github.event_name != 'push' ||
       !startsWith(github.event.head_commit.message, 'chore: release'))
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: true
          pixi-version: v0.74.0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        env:
          DO_BUMP: ${{ github.event_name == 'push' && 'true' || inputs.bump }}
          SET_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          set -euo pipefail
          read_version() {
            awk '
              /^\[workspace\.package\]$/ { in_sec = 1; next }
              /^\[/ { in_sec = 0 }
              in_sec && /^version =/ {
                line = $0
                sub(/^version = "/, "", line)
                sub(/"$/, "", line)
                print line
                exit
              }
            ' Cargo.toml
          }

          BEFORE="$(read_version)"
          echo "version_before=${BEFORE}" >> "$GITHUB_OUTPUT"

          if [[ "${DO_BUMP}" == "true" ]]; then
            if [[ -n "${SET_VERSION}" ]]; then
              ./scripts/update-version.sh --set "${SET_VERSION}"
            else
              ./scripts/update-version.sh
            fi
          else
            echo "Skipping version bump (workflow_dispatch bump=false)"
          fi

          VERSION="$(read_version)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${BEFORE} -> ${VERSION}"

      - name: Build pixi package
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          pixi run package
          ls -lah dist
          test -n "$(find dist -maxdepth 1 -name 'fresh-gui-*.conda' -print -quit)"

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum fresh-gui-*.conda | tee SHA256SUMS

      - name: Commit version bump and push tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail

          if ! git diff --quiet; then
            git add -u
            git commit -m "chore: release ${VERSION}"
          else
            echo "No version-file changes to commit"
          fi

          # Main may move while the long package build runs (other merges).
          # Rebase + retry so we do not fail after a successful build.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            if [[ "${attempt}" -eq 5 ]]; then
              echo "Failed to push version bump to main after retries" >&2
              exit 1
            fi
            echo "Push to main rejected (attempt ${attempt}); rebasing onto origin/main…"
            git fetch origin main
            git rebase origin/main
          done

          # Tag the commit that landed on main (after any rebase).
          git tag -f -a "${TAG}" -m "fresh-gui ${VERSION}"
          if ! git push origin "${TAG}"; then
            echo "Tag ${TAG} may already exist on origin; continuing"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail

          NOTES="$(mktemp)"
          {
            echo "## fresh-gui \`${VERSION}\`"
            echo
            echo "Remote daemon (embedded browser UI + WebSocket PTYs)."
            echo
            echo "### Assets"
            echo
            echo "| Asset | Notes |"
            echo "|-------|-------|"
            echo "| \`fresh-gui-*-*.conda\` | Pixi/conda linux-64 package (glibc 2.28+): \`bin/fresh-gui\` + \`share/fresh-gui/ui\` |"
            echo "| \`fresh-gui-*-x86_64-unknown-linux-gnu.tar.gz\` | Standalone Linux binary (glibc **≥ 2.31**), same layout |"
            echo "| \`fresh-gui-*-x86_64-unknown-linux-musl.tar.gz\` | Standalone Linux musl binary (Alpine, static-friendly), same layout |"
            echo "| \`fresh-gui-*-x86_64-pc-windows-msvc.zip\` | Standalone Windows daemon, same layout |"
            echo "| \`fresh-gui-client-*-x86_64-unknown-linux-gnu.tar.gz\` | Linux GPUI host (\`fresh-gui-app\`) |"
            echo "| \`fresh-gui-client-*-x86_64-pc-windows-msvc.zip\` | Windows GPUI host (\`fresh-gui-app.exe\`) |"
            echo
            echo "These assets are the **daemon** plus the packaged browser UI. Separate jobs attach the GPUI hosts: Linux \`fresh-gui-client-*-x86_64-unknown-linux-gnu.tar.gz\` (\`fresh-gui-app\`) and Windows \`fresh-gui-client-*-x86_64-pc-windows-msvc.zip\` (\`fresh-gui-app.exe\`). \`pixi run gui\` is still the from-source path."
            echo
            echo "### Install (pixi / conda)"
            echo
            echo '```bash'
            echo "# download the .conda asset, then:"
            echo "pixi global install ./fresh-gui-${VERSION}-*.conda"
            echo "fresh-gui --help"
            echo '```'
            echo
            echo "### Install (standalone binary)"
            echo
            echo '```bash'
            echo "# Linux (glibc ≥ 2.31) example:"
            echo "tar -xzf fresh-gui-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            echo "cd fresh-gui-${VERSION}-x86_64-unknown-linux-gnu"
            echo "./bin/fresh-gui"
            echo '```'
            echo
            echo "### Linux GPUI client"
            echo
            echo "Built on \`ubuntu-latest\`. Needs **glibc ≥ 2.39** (Ubuntu 24.04+; a newer runner image can raise this floor) — not the daemon's glibc 2.31 zigbuild. Also needs an X11 or Wayland session, fontconfig, and a Vulkan loader (\`libvulkan.so.1\`, loaded on demand) plus Wayland client libraries."
            echo
            echo '```bash'
            echo "tar -xzf fresh-gui-client-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            echo "cd fresh-gui-client-${VERSION}-x86_64-unknown-linux-gnu"
            echo "./fresh-gui-app remote add lab user@server --root /path/to/project"
            echo "./fresh-gui-app remote connect lab"
            echo '```'
            echo
            echo '```bash'
            echo "# Debian/Ubuntu runtime libraries:"
            echo "sudo apt install libvulkan1 libfontconfig1 libfreetype6 libwayland-client0 libxkbcommon0 libxkbcommon-x11-0 libxcb1"
            echo '```'
            echo
            echo "Or install from git at this tag:"
            echo
            echo '```bash'
            echo "pixi global install --git https://github.com/amirhosseindavoody/fresh-gui.git --tag ${TAG}"
            echo '```'
            echo
            echo "Default settings file: \`~/.config/fresh-gui/config.json\` (theme, fonts, shell)."
            echo "Windows: \`%APPDATA%\\fresh-gui\\config.json\`."
          } >"${NOTES}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — uploading conda assets"
            gh release upload "${TAG}" dist/fresh-gui-*.conda dist/SHA256SUMS --clobber
          else
            gh release create "${TAG}" \
              dist/fresh-gui-*.conda \
              dist/SHA256SUMS \
              --title "fresh-gui ${VERSION}" \
              --notes-file "${NOTES}" \
              --verify-tag
          fi

  binaries:
    name: Binary (${{ matrix.name }})
    needs: release
    if: needs.release.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gnu
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            zig_glibc: "2.31"
            archive: tar.gz
          - name: linux-musl
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            zig_glibc: ""
            archive: tar.gz
          - name: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            zig_glibc: ""
            archive: zip
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          submodules: recursive
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          targets: ${{ matrix.target }}

      # Match `packageManager` in crates/fresh-gui-app/ui/package.json (bun.lock).
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-bin-${{ matrix.target }}
          workspaces: ". -> target"

      - name: Build host UI
        shell: bash
        run: |
          set -euo pipefail
          cd crates/fresh-gui-app/ui
          bun install --frozen-lockfile
          bun run build
          test -f dist/index.html

      - name: Install zig + cargo-zigbuild (linux cross)
        if: matrix.name == 'linux-gnu' || matrix.name == 'linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz \
            | tar -xJ -C /tmp
          echo "/tmp/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --locked --version 0.19.8

      - name: Build binary (linux-gnu glibc ≥ 2.31)
        if: matrix.name == 'linux-gnu'
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
          CARGO_PROFILE_RELEASE_LTO: thin
        run: |
          set -euo pipefail
          cargo zigbuild --release --locked -p fresh-gui \
            --target "${{ matrix.target }}.${{ matrix.zig_glibc }}"

      - name: Build binary (linux-musl)
        if: matrix.name == 'linux-musl'
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
          CARGO_PROFILE_RELEASE_LTO: thin
        run: |
          set -euo pipefail
          cargo zigbuild --release --locked -p fresh-gui \
            --target "${{ matrix.target }}"

      - name: Build binary (windows)
        if: matrix.name == 'windows'
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
          CARGO_PROFILE_RELEASE_LTO: thin
        run: |
          set -euo pipefail
          cargo build --release --locked -p fresh-gui \
            --target "${{ matrix.target }}"

      - name: Package archive
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf dist/binaries
          mkdir -p dist/binaries
          ./scripts/package-binary.sh "${{ matrix.target }}" "${VERSION}" dist/binaries
          ls -lah dist/binaries

      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/binaries/fresh-gui-*.${{ matrix.archive }} dist/binaries/fresh-gui-*.${{ matrix.archive }}.sha256)
          test "${#assets[@]}" -ge 2
          gh release upload "${TAG}" "${assets[@]}" --clobber

  client-windows:
    name: GPUI client (windows)
    needs: release
    if: needs.release.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          submodules: recursive
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-client-x86_64-pc-windows-msvc
          workspaces: ". -> target"

      - name: Build GPUI host
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
          CARGO_PROFILE_RELEASE_LTO: thin
        run: |
          set -euo pipefail
          cargo build --release --locked -p fresh-gui-app \
            --target x86_64-pc-windows-msvc

      - name: Package client archive
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf dist/client
          mkdir -p dist/client
          bash ./scripts/package-client.sh x86_64-pc-windows-msvc "${VERSION}" dist/client
          ls -lah dist/client

      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/client/fresh-gui-client-*.zip dist/client/fresh-gui-client-*.zip.sha256)
          test "${#assets[@]}" -ge 2
          gh release upload "${TAG}" "${assets[@]}" --clobber

  # Same shape as client-windows. On pull_request, `release` is skipped (it
  # would bump CalVer and publish); this job still compiles and packages so
  # the Linux archive is verified before merge. The GitHub Release upload
  # runs only after `release` succeeds.
  client-linux:
    name: GPUI client (linux)
    needs: release
    if: >-
      !cancelled() &&
      (needs.release.result == 'success' ||
       (github.event_name == 'pull_request' && needs.release.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout release tag
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          submodules: recursive
          fetch-depth: 1

      - name: Checkout pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install GPUI system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          pkgs=(
            pkg-config
            build-essential
            g++
            clang
            cmake
            libssl-dev
            libzstd-dev
            libwayland-dev
            libxkbcommon-dev
            libxkbcommon-x11-dev
            libx11-dev
            libx11-xcb-dev
            libxcb1-dev
            libxcb-render0-dev
            libxcb-shape0-dev
            libxcb-xfixes0-dev
            libvulkan-dev
            libvulkan1
          )
          # Package names differ slightly across Ubuntu releases (ubuntu-latest).
          if apt-cache show libfontconfig1-dev >/dev/null 2>&1; then
            pkgs+=(libfontconfig1-dev)
          else
            pkgs+=(libfontconfig-dev)
          fi
          if apt-cache show libfreetype6-dev >/dev/null 2>&1; then
            pkgs+=(libfreetype6-dev)
          else
            pkgs+=(libfreetype-dev)
          fi
          if apt-cache show libstdc++-14-dev >/dev/null 2>&1; then
            pkgs+=(libstdc++-14-dev)
          fi
          sudo apt-get install -y --no-install-recommends "${pkgs[@]}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-client-x86_64-unknown-linux-gnu
          workspaces: ". -> target"

      - name: Build GPUI host
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
          CARGO_PROFILE_RELEASE_LTO: thin
        run: |
          set -euo pipefail
          cargo build --release --locked -p fresh-gui-app \
            --target x86_64-unknown-linux-gnu

      - name: Package client archive
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${VERSION}" ]]; then
            VERSION="$(awk '
              /^\[workspace\.package\]$/ { in_sec = 1; next }
              /^\[/ { in_sec = 0 }
              in_sec && /^version =/ {
                line = $0
                sub(/^version = "/, "", line)
                sub(/"$/, "", line)
                print line
                exit
              }
            ' Cargo.toml)"
          fi
          rm -rf dist/client
          mkdir -p dist/client
          bash ./scripts/package-client.sh x86_64-unknown-linux-gnu "${VERSION}" dist/client
          ls -lah dist/client
          shopt -s nullglob
          archives=(dist/client/fresh-gui-client-*.tar.gz)
          test "${#archives[@]}" -eq 1
          test -f "${archives[0]}.sha256"
          tar -tzf "${archives[0]}" | grep -q '/fresh-gui-app$'
          (cd dist/client && sha256sum -c ./*.tar.gz.sha256)

      - name: Upload to GitHub Release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/client/fresh-gui-client-*.tar.gz dist/client/fresh-gui-client-*.tar.gz.sha256)
          test "${#assets[@]}" -ge 2
          gh release upload "${TAG}" "${assets[@]}" --clobber
