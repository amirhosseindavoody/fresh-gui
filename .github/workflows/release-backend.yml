# Bump CalVer, build the linux-64 fresh-gui pixi package, and publish
# a GitHub Release with the .conda artifact.
#
# Triggers on every push to main (merge) and on manual dispatch.
# Commits/tags pushed with GITHUB_TOKEN do not re-trigger this workflow.

name: Release backend

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Bump CalVer (YYYY.MMDD.N) before building
        type: boolean
        default: true
      version:
        description: Optional explicit version (YYYY.MMDD.N). Empty = auto bump.
        type: string
        required: false
        default: ""

concurrency:
  group: release-backend-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Bump · package · release
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    # Avoid publishing releases from forks. Skip bot release commits if they
    # ever re-trigger (e.g. PAT instead of GITHUB_TOKEN).
    if: >-
      github.repository == 'amirhosseindavoody/fresh-gui' &&
      (github.event_name != 'push' ||
       !startsWith(github.event.head_commit.message, 'chore: release'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: true
          pixi-version: v0.74.0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        env:
          DO_BUMP: ${{ github.event_name == 'push' && 'true' || inputs.bump }}
          SET_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          set -euo pipefail
          read_version() {
            awk '
              /^\[workspace\.package\]$/ { in_sec = 1; next }
              /^\[/ { in_sec = 0 }
              in_sec && /^version =/ {
                line = $0
                sub(/^version = "/, "", line)
                sub(/"$/, "", line)
                print line
                exit
              }
            ' Cargo.toml
          }

          BEFORE="$(read_version)"
          echo "version_before=${BEFORE}" >> "$GITHUB_OUTPUT"

          if [[ "${DO_BUMP}" == "true" ]]; then
            if [[ -n "${SET_VERSION}" ]]; then
              ./scripts/update-version.sh --set "${SET_VERSION}"
            else
              ./scripts/update-version.sh
            fi
          else
            echo "Skipping version bump (workflow_dispatch bump=false)"
          fi

          VERSION="$(read_version)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${BEFORE} -> ${VERSION}"

      - name: Build pixi package
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          pixi run package
          ls -lah dist
          test -n "$(find dist -maxdepth 1 -name 'fresh-gui-*.conda' -print -quit)"

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum fresh-gui-*.conda | tee SHA256SUMS

      - name: Commit version bump and push tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail

          if ! git diff --quiet; then
            git add -u
            git commit -m "chore: release ${VERSION}"
          else
            echo "No version-file changes to commit"
          fi

          # Main may move while the long package build runs (other merges).
          # Rebase + retry so we do not fail after a successful build.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            if [[ "${attempt}" -eq 5 ]]; then
              echo "Failed to push version bump to main after retries" >&2
              exit 1
            fi
            echo "Push to main rejected (attempt ${attempt}); rebasing onto origin/main…"
            git fetch origin main
            git rebase origin/main
          done

          # Tag the commit that landed on main (after any rebase).
          git tag -f -a "${TAG}" -m "fresh-gui ${VERSION}"
          if ! git push origin "${TAG}"; then
            echo "Tag ${TAG} may already exist on origin; continuing"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail

          NOTES="$(mktemp)"
          {
            echo "## fresh-gui \`${VERSION}\`"
            echo
            echo "Linux remote daemon (browser UI + WebSocket PTYs), packaged for **linux-64**."
            echo
            echo "### Install from this release"
            echo
            echo '```bash'
            echo "# download the .conda asset, then:"
            echo "pixi global install ./fresh-gui-${VERSION}-*.conda"
            echo "fresh-gui --help"
            echo '```'
            echo
            echo "Or install from git at this tag:"
            echo
            echo '```bash'
            echo "pixi global install --git https://github.com/amirhosseindavoody/fresh-gui.git --tag ${TAG}"
            echo '```'
            echo
            echo "Default settings file: \`~/.config/fresh-gui/config.json\` (theme, fonts, shell)."
          } >"${NOTES}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — uploading assets"
            gh release upload "${TAG}" dist/fresh-gui-*.conda dist/SHA256SUMS --clobber
          else
            gh release create "${TAG}" \
              dist/fresh-gui-*.conda \
              dist/SHA256SUMS \
              --title "fresh-gui ${VERSION}" \
              --notes-file "${NOTES}" \
              --verify-tag
          fi
